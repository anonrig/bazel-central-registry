matrix:
  bazel: ["7.x", "8.x", "9.x"]
  # Linux platforms need GCC 12+ or Clang 15+ for full C++20 constexpr support.
  unix_platform: ["macos", "macos_arm64", "ubuntu2404", "debian13"]

tasks:
  unix_test:
    platform: ${{ unix_platform }}
    bazel: ${{ bazel }}
    build_flags:
    - --cxxopt=-std=c++20
    build_targets:
      - '@ada-url//:ada-url'
  windows_test:
    platform: "windows"
    bazel: ${{ bazel }}
    build_flags:
    - --cxxopt=/std:c++20
    build_targets:
      - '@ada-url//:ada-url'
